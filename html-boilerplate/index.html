<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>This Is Heading 1</h1>
    <h3>This Is Heading 3</h3>
    <p>This is a paragraph. This is <strong>bold text</strong>.</p>
    <p>This is another paragraph. This is <em>italic text</em>.</p>

    <h1>This is a list</h1>
    <ul> <!-- unordered list -->
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ul>
    <ol> <!-- ordered list -->
        <li>Ordered item 1</li>
        <li>Ordered item 2</li>
        <li>Ordered item 3</li>
    </ol>
</body>
</html>
